name: fajimobileapp
description: "Enterprise-grade Flutter application with Clean Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  flutter_remix: ^0.0.3
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Code Generation and Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  
  # Environment Configuration
  flutter_dotenv: ^5.1.0
  
  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  
  # Responsive Design
  flutter_screenutil: ^5.9.3
  responsive_sizer: ^3.3.1
  
  # Country Picker
  country_picker: ^2.0.26
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Local Notifications
  flutter_local_notifications: ^17.2.3
  
  # Toast Notifications
  toastification: ^2.3.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Image Handling
  image_picker: ^1.0.7
  cloudinary_public: ^0.21.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting and Analysis
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  retrofit_generator: ^9.1.2
  
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - .env
    - .env.dev
    - .env.staging
    - .env.production
  
  # Fonts - Using Modica Pro exclusively
  fonts:
    - family: Modica Pro
      fonts:
        - asset: assets/fonts/ModicaPro-Normal-Hairline.otf
          weight: 100
        - asset: assets/fonts/ModicaPro-Normal-Thin.otf
          weight: 200
        - asset: assets/fonts/ModicaPro-Normal-Light.otf
          weight: 300
        - asset: assets/fonts/ModicaPro-Normal-Regular.otf
          weight: 400
        - asset: assets/fonts/ModicaPro-Normal-Medium.otf
          weight: 500
        - asset: assets/fonts/ModicaPro-Normal-SemiBold.otf
          weight: 600
        - asset: assets/fonts/ModicaPro-Normal-Bold.otf
          weight: 700
        - asset: assets/fonts/ModicaPro-Normal-Black.otf
          weight: 800
        - asset: assets/fonts/ModicaPro-Normal-Ultra.otf
          weight: 900
        - asset: assets/fonts/ModicaPro-Normal-HairlineItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-ThinItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-BlackItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/ModicaPro-Normal-UltraItalic.otf
          weight: 900
          style: italic
  
  # Generate localization files
  generate: true
